# Hosted verify (K8; K50): frozen install + the kitchen's acceptance command on
# GitHub-hosted Linux, Windows and macOS for every code push to master or to a
# wave branch. Since K50 the run on a wave's commit is its acceptance run.
# Logs are uploaded per system for 7 days, long enough for a wave to close.
name: verify

on:
  # push only: a fork's pull request never gets this run (no pull_request or
  # pull_request_target trigger), and a push comes only from this repository.
  push:
    # Doc-only pushes are skipped by the negated paths below.
    branches: [master, 'wave/**', 'devin/**']
    # paths mirrors the "no test reads these" set (INERT) in scripts/suite.mjs:
    # '**' includes everything, each '!' drops an inert set, and the files a
    # kitchen test reads are re-included after the negations (GitHub applies
    # path patterns in order; a later positive pattern re-includes). A push
    # that only touches inert files costs nothing; anything else still runs.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!waves/**'
      - '!kitchen/**'
      - '!templates/**'
      - '!milestones/**'
      - '!research/**'
      - '!tasks/**'
      - '!.devin/**'
      - '!.cursor/**'
      - '!.gitignore'
      # The INERT exemptions: files tests/kitchen or kitchen-stats.mjs reads.
      - 'AGENTS.md'
      - 'STATUS.md'
      - 'kitchen/INBOX.md'
      - 'kitchen/demo/bt11b-replay.mjs'
      - 'kitchen/demo/gh-standin.cjs'
      - 'kitchen/demo/record.mjs'
      - 'docs/box-v4/KITCHEN.md'
      - 'docs/box-v4/DECISIONS.md'
      - 'docs/box-v4/CONTRACTS.md'
      - 'kitchen/reviews/proof-gaps.json'
      - 'kitchen/reviews/guard-breaks.json'
      - 'docs/box-v4/WALKTHROUGH.md'
      - 'docs/box-v4/register.json'
      - 'waves/*.md'
      # K35: the rulebook guard reads every live rule/role/card/adapter file.
      - 'kitchen/README.md'
      - 'kitchen/roles/*.md'
      - 'kitchen/stations/*.md'
      - 'templates/wave.md'
      - '.devin/rules/box-kitchen.md'
      - '.devin/plugins/box-pstack/skills/poteto-mode/SKILL.md'
      - '.devin/plugins/box-pstack/DEVIN-COMPATIBILITY.md'
      - '.claude/skills/kitchen/SKILL.md'
      - '.cursor/rules/box-kitchen.mdc'
      # K76: doc-shaped files a product test or package names (suite.mjs productNames). A kitchen test
      # checks every tracked file against isInert, so this list cannot drift from it.
      - '.gitignore'
      - 'CLAUDE.md'
      - 'FIRST-FIVE-MINUTES.md'
      - 'README.md'
      - 'docs/box-v4/BOUNTY-FORMAT.md'
      - 'docs/box-v4/LAUNCH.md'
      - 'docs/box-v4/launch/getting-started.md'
      - 'docs/box-v4/launch/queue-handoff.md'
      - 'kitchen/memory/measure.mjs'
      - 'kitchen/scenarios/bt4.md'

# A newer push to the same ref cancels a stale run, queued or in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets are referenced or needed anywhere in this workflow.
permissions:
  contents: read

jobs:
  # K76: which jobs this push owes. full=false when every changed path is read by the kitchen suite alone
  # (scripts/ci-select.mjs, the rule verify's local reuse uses); then bounty, platform and install-node22
  # are skipped and kitchen and audit run. A new branch, a forced push or anything unreadable is full=true,
  # and the heavy jobs run on anything but an explicit full=false.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Select the jobs this push owes
        id: select
        run: node scripts/ci-select.mjs "${{ github.event.before }}" "${{ github.sha }}"

  bounty:
    needs: select
    if: needs.select.outputs.full != 'false'
    # K50: named images and independent results on every OS; no failure cancels another.
    name: bounty (${{ matrix.os }} shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, shard: 1, shards: 4 }
          - { os: windows-2025, shard: 2, shards: 4 }
          - { os: windows-2025, shard: 3, shards: 4 }
          - { os: windows-2025, shard: 4, shards: 4 }
          - { os: macos-15, shard: 1, shards: 2 }
          - { os: macos-15, shard: 2, shards: 2 }
          - { os: ubuntu-24.04, shard: 1, shards: 2 }
          - { os: ubuntu-24.04, shard: 2, shards: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Git Bash on Windows: from PowerShell `cat` and `rm` are not on PATH (PF11).
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 — verify's merge-base and run-history reads need full git history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # K50: on a wave branch the checkout has origin/master but no local
      # master, and bt8b diffs master...HEAD (run 42802182752, all systems).
      - name: Make master resolvable on a wave branch
        run: git rev-parse -q --verify refs/heads/master >/dev/null || git branch master origin/master

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # `python` by name, at the host's 3.12: test:box-bounty runs a declared
      # `python -c` check against the snapshot. Ubuntu ships `python3` but no
      # `python`; setup-python provides the command and the version in one step.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Same path as the host: repository-local pnpm 10.34.5 (scripts/tooling, lockfile-pinned).
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(node scripts/pnpm.mjs store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      # K29: no database. Host-only Windows cases still run on Windows;
      # sharding partitions files without changing workers, assertions or skips.
      - name: Build CLI for bounty tests
        run: node scripts/workspace.mjs build

      - name: bounty suite
        run: |
          set -o pipefail
          node scripts/suite.mjs box --suite bounty --shard ${{ matrix.shard }}/${{ matrix.shards }} 2>&1 | tee "$RUNNER_TEMP/bounty.log"

      # K50: skips are counted per system, never silent. Each skipped test is named beside its assertion in the
      # tests, with the reason (grep the tests for "Host-only"); this prints how many each suite skipped here.
      - name: Skips on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/bounty.log"; do
            [ -f "$log" ] || continue
            printf '%s on ${{ matrix.os }}: ' "$(basename "$log")"
            perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -aE '^\s+Tests ' | tr -s ' ' | tr '\n' ' '
            echo
          done

      # K59: the eight slowest tests here, so a test creeping toward its limit shows before it fails. The limit is 60 s on
      # Windows and 30 s elsewhere (scripts/test-timeout.mjs); a test that sets its own is not bound by it. Reports only:
      # `|| true`, and always(), so it can never fail a job. The runner's log holds real escape bytes, hence `perl`.
      - name: Slowest tests on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/bounty.log"; do
            [ -f "$log" ] && perl -pe 's/\e\[[0-9;]*m//g' "$log"
          done | grep -aE '^\s+✓ ' | grep -avE '^\s+✓ tests/' \
            | perl -ne '/✓ (.*?)\s+(\d+)ms\s*$/ and printf "%7d ms  %.110s\n", $2, $1' \
            | sort -rn | head -8 || true

      # K61: the logs are a diagnostic aid. GitHub's own artifact storage failed one run (43088503658, attempt 2) after every
      # test step had passed, so a failed upload must not fail the job; the step still shows its failure in the log.
      - name: Upload verify run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: bounty-runs-${{ matrix.shard }}-${{ matrix.os }}-${{ github.run_id }}
          path: |
            .kitchen/runs/
            ${{ runner.temp }}/bounty.log
          retention-days: 7
          if-no-files-found: ignore

  kitchen:
    # K50: named images and independent results on every OS; no failure cancels another.
    name: kitchen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Git Bash on Windows: from PowerShell `cat` and `rm` are not on PATH (PF11).
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 — verify's merge-base and run-history reads need full git history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # K50: on a wave branch the checkout has origin/master but no local
      # master, and bt8b diffs master...HEAD (run 42802182752, all systems).
      - name: Make master resolvable on a wave branch
        run: git rev-parse -q --verify refs/heads/master >/dev/null || git branch master origin/master

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Same path as the host: repository-local pnpm 10.34.5 (scripts/tooling, lockfile-pinned).
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(node scripts/pnpm.mjs store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      - name: Promise lint
        run: node scripts/pnpm.mjs run lint

      - name: Read Playwright version from lockfile
        id: playwright
        run: node -e "const fs = require('node:fs'); const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8'); const version = /'@playwright\/test@([^']+)'/.exec(lock)?.[1]; if (!version) throw new Error('Playwright version missing from lockfile'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\\n')"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .runtime/browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium into the path suite.mjs sets as PLAYWRIGHT_BROWSERS_PATH — needed by
      # tests/kitchen/k16-record.test.ts, which drives the demo recorder's browser.
      # K60: the browser itself and its system libraries are two steps. The browser is fetched from Playwright's own
      # download and must succeed. The libraries come from the runner's apt mirror, which was dead on run 43035172554
      # (three attempts cancelled ten minutes in, the verify step never ran), so that step is bounded and may fail:
      # the browser-backed test still runs and says by itself if a library is missing. Windows and macOS need none.
      - name: Install Chromium for browser-backed tests
        run: node scripts/pnpm.mjs exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      - name: Install Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            if timeout 150 node scripts/pnpm.mjs exec playwright install-deps chromium; then exit 0; fi
            echo "attempt $attempt did not finish"
          done
          echo "system libraries not installed: the browser-backed test says if one is missing"
          exit 1
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      - name: verify
        run: node scripts/verify.mjs --full test:kitchen

      # K50: skips are counted per system, never silent. Each skipped test is named beside its assertion in the
      # tests, with the reason (grep the tests for "Host-only"); this prints how many each suite skipped here.
      - name: Skips on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/kitchen.log"; do
            [ -f "$log" ] || continue
            printf '%s on ${{ matrix.os }}: ' "$(basename "$log")"
            perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -aE '^\s+Tests ' | tr -s ' ' | tr '\n' ' '
            echo
          done

      # K59: the eight slowest tests here, so a test creeping toward its limit shows before it fails. The limit is 60 s on
      # Windows and 30 s elsewhere (scripts/test-timeout.mjs); a test that sets its own is not bound by it. Reports only:
      # `|| true`, and always(), so it can never fail a job. The runner's log holds real escape bytes, hence `perl`.
      - name: Slowest tests on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/kitchen.log"; do
            [ -f "$log" ] && perl -pe 's/\e\[[0-9;]*m//g' "$log"
          done | grep -aE '^\s+✓ ' | grep -avE '^\s+✓ tests/' \
            | perl -ne '/✓ (.*?)\s+(\d+)ms\s*$/ and printf "%7d ms  %.110s\n", $2, $1' \
            | sort -rn | head -8 || true

      # K61: the logs are a diagnostic aid. GitHub's own artifact storage failed one run (43088503658, attempt 2) after every
      # test step had passed, so a failed upload must not fail the job; the step still shows its failure in the log.
      - name: Upload verify run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kitchen-runs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            .kitchen/runs/
            ${{ runner.temp }}/kitchen.log
          retention-days: 7
          if-no-files-found: ignore

  platform:
    needs: select
    if: needs.select.outputs.full != 'false'
    # K50: named images and independent results on every OS; no failure cancels another.
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Git Bash on Windows: from PowerShell `cat` and `rm` are not on PATH (PF11).
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 — verify's merge-base and run-history reads need full git history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # K50: on a wave branch the checkout has origin/master but no local
      # master, and bt8b diffs master...HEAD (run 42802182752, all systems).
      - name: Make master resolvable on a wave branch
        run: git rev-parse -q --verify refs/heads/master >/dev/null || git branch master origin/master

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Same path as the host: repository-local pnpm 10.34.5 (scripts/tooling, lockfile-pinned).
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(node scripts/pnpm.mjs store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      - name: Read Playwright version from lockfile
        id: playwright
        run: node -e "const fs = require('node:fs'); const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8'); const version = /'@playwright\/test@([^']+)'/.exec(lock)?.[1]; if (!version) throw new Error('Playwright version missing from lockfile'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\\n')"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .runtime/browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium into the path suite.mjs sets as PLAYWRIGHT_BROWSERS_PATH — needed by
      # tests/kitchen/k16-record.test.ts, which drives the demo recorder's browser.
      # K60: the browser itself and its system libraries are two steps. The browser is fetched from Playwright's own
      # download and must succeed. The libraries come from the runner's apt mirror, which was dead on run 43035172554
      # (three attempts cancelled ten minutes in, the verify step never ran), so that step is bounded and may fail:
      # the browser-backed test still runs and says by itself if a library is missing. Windows and macOS need none.
      - name: Install Chromium for browser-backed tests
        run: node scripts/pnpm.mjs exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      - name: Install Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            if timeout 150 node scripts/pnpm.mjs exec playwright install-deps chromium; then exit 0; fi
            echo "attempt $attempt did not finish"
          done
          echo "system libraries not installed: the browser-backed test says if one is missing"
          exit 1
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      # PF1: the board suite stays apart from kitchen's acceptance budget.
      # Its journeys use the built CLI; suite.mjs also builds Next for its pages.
      - name: Build CLI for platform journeys
        run: node scripts/workspace.mjs build

      - name: platform suite
        run: |
          set -o pipefail
          node scripts/suite.mjs platform 2>&1 | tee "$RUNNER_TEMP/platform.log"

      # K50: skips are counted per system, never silent. Each skipped test is named beside its assertion in the
      # tests, with the reason (grep the tests for "Host-only"); this prints how many each suite skipped here.
      - name: Skips on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/platform.log"; do
            [ -f "$log" ] || continue
            printf '%s on ${{ matrix.os }}: ' "$(basename "$log")"
            perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -aE '^\s+Tests ' | tr -s ' ' | tr '\n' ' '
            echo
          done

      # K59: the eight slowest tests here, so a test creeping toward its limit shows before it fails. The limit is 60 s on
      # Windows and 30 s elsewhere (scripts/test-timeout.mjs); a test that sets its own is not bound by it. Reports only:
      # `|| true`, and always(), so it can never fail a job. The runner's log holds real escape bytes, hence `perl`.
      - name: Slowest tests on ${{ matrix.os }}
        if: always()
        run: |
          for log in .kitchen/runs/*/test_box-bounty.log .kitchen/runs/*/test_kitchen.log "$RUNNER_TEMP/platform.log"; do
            [ -f "$log" ] && perl -pe 's/\e\[[0-9;]*m//g' "$log"
          done | grep -aE '^\s+✓ ' | grep -avE '^\s+✓ tests/' \
            | perl -ne '/✓ (.*?)\s+(\d+)ms\s*$/ and printf "%7d ms  %.110s\n", $2, $1' \
            | sort -rn | head -8 || true

      # K61: the logs are a diagnostic aid. GitHub's own artifact storage failed one run (43088503658, attempt 2) after every
      # test step had passed, so a failed upload must not fail the job; the step still shows its failure in the log.
      - name: Upload verify run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: platform-runs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            .kitchen/runs/
            ${{ runner.temp }}/platform.log
          retention-days: 7
          if-no-files-found: ignore

  # K50: the production dependency audit. The advisory database is the same
  # from every system, so one Linux job answers it. A new high or critical
  # advisory on a production dependency fails the run.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Audit production dependencies (high and critical fail)
        run: node scripts/pnpm.mjs audit --prod --audit-level high

  # BT12: the installable package's declared floor is Node 22 (NODE_MINIMUM in
  # packages/box-cli/src/node-check.ts), so the packed artifact's install
  # test and packaging test run on Node 22 here — the oldest Node the
  # package claims. The repository's own toolchain pins Node 24 (root
  # engines ">=24.11.0 <25"; pnpm refuses to install a project whose own
  # engines exclude the running Node), so dependencies are installed and the
  # artifact is packed with 24 first; only then does the job switch to the
  # current Node 22 release and run the two files, which pack the artifact
  # again under 22 and drive the whole $0 journey through it.
  # K50: on all three systems, each reported apart.
  install-node22:
    needs: select
    if: needs.select.outputs.full != 'false'
    name: install-node22 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 15 || 30 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full commit SHA, never a moving tag: v7.1.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      - name: Build the package artifact (Node 24)
        run: node packages/box-cli/pack.mjs

      - name: Switch to Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.13.0'

      - name: Install and packaging tests on Node 22
        run: |
          node --version
          node scripts/suite.mjs box --suite bounty tests/box/bounty/bt12-install.test.ts tests/box/bounty/bt12-package.test.ts
