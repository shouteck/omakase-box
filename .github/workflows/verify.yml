# Off-machine verify (wave K8): frozen install + the kitchen's acceptance command on a
# GitHub-hosted Linux runner for every code push to master, logs uploaded for 3 days.
name: verify

on:
  push:
    # Iterating: wave/K8 triggers too; master-only before merge (K8 wave file records the proof).
    branches: [master, wave/K8]
    # paths-ignore mirrors the "no test reads these" set (INERT) in scripts/suite.mjs: a push
    # that only touches docs/process files costs nothing. Anything else still runs.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'waves/**'
      - 'kitchen/**'
      - 'templates/**'
      - 'milestones/**'
      - 'research/**'
      - 'tasks/**'
      - '.devin/**'
      - '.cursor/**'
      - '.gitignore'

# A newer push to the same ref cancels the stale run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets are referenced or needed anywhere in this workflow.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — verify's scoped-check merge-base and run history read git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Same path as the host: repository-local pnpm 10.34.5 (scripts/tooling, lockfile-pinned).
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      # Chromium into the path suite.mjs sets as PLAYWRIGHT_BROWSERS_PATH — needed by
      # tests/auth/bootstrap/browser-cookie.test.ts (in `check`) and the e2e suite.
      - name: Install Chromium for browser-backed tests
        run: node scripts/pnpm.mjs exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      # check's live tests import services/*/dist bundles (e.g. intent-store.js). The host
      # always has dist/ from earlier builds; a fresh runner checkout does not, and verify
      # runs check before build — so build once up front. verify's own build step still
      # runs for real afterwards (idempotent vite rebuild).
      - name: Build service bundles for check's live tests
        run: node scripts/pnpm.mjs build

      # Suite-list decision (K8, recorded in waves/K8.md) — never silently narrowed; each
      # exclusion is named here:
      #  * test:containers — needs a local Docker daemon plus the frozen M-series public
      #    image (public-task-toolchain:m4-v1, built locally, in no registry); unavailable.
      #  * test:box-package — tests/box/package/review-security-r2.test.ts has one
      #    platform-bound test: a case-alias entrypoint ('SRC/POLICY/LOADER.TS') must still
      #    resolve, which only holds on a case-insensitive filesystem. On Linux it fails
      #    closed (PreparationGap). Test content is outside this wave's scope, so the suite
      #    is host-only until a per-file split exists. 58/59 pass; the rest stay green here.
      # `check --full` covers bootstrap/auth/contracts/planner; they are still named so the
      # list reads as the whole suite set (deduped inside one verify run).
      - name: verify
        run: node scripts/verify.mjs --full test:bootstrap test:auth test:contracts test:planner test:box-contracts test:box-auth test:box-delegation test:analysis test:compiler test:runner test:portal test:acceptance test:security test:e2e test:kitchen

      - name: Upload verify run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-runs-${{ github.run_id }}
          path: .kitchen/runs/
          retention-days: 3
          if-no-files-found: ignore
