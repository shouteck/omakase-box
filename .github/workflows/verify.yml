# Hosted verify (K8; K50): frozen install + the kitchen's acceptance command on
# GitHub-hosted Linux, Windows and macOS for every code push to master or to a
# wave branch. Since K50 the run on a wave's commit is its acceptance run.
# Logs are uploaded per system for 7 days, long enough for a wave to close.
name: verify

on:
  # push only: a fork's pull request never gets this run (no pull_request or
  # pull_request_target trigger), and a push comes only from this repository.
  push:
    # Doc-only pushes are skipped by the negated paths below.
    branches: [master, 'wave/**']
    # paths mirrors the "no test reads these" set (INERT) in scripts/suite.mjs:
    # '**' includes everything, each '!' drops an inert set, and the files a
    # kitchen test reads are re-included after the negations (GitHub applies
    # path patterns in order; a later positive pattern re-includes). A push
    # that only touches inert files costs nothing; anything else still runs.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!waves/**'
      - '!kitchen/**'
      - '!templates/**'
      - '!milestones/**'
      - '!research/**'
      - '!tasks/**'
      - '!.devin/**'
      - '!.cursor/**'
      - '!.gitignore'
      # The INERT exemptions: files tests/kitchen or kitchen-stats.mjs reads.
      - 'AGENTS.md'
      - 'STATUS.md'
      - 'kitchen/INBOX.md'
      - 'kitchen/demo/bt11b-replay.mjs'
      - 'kitchen/demo/gh-standin.cjs'
      - 'kitchen/demo/record.mjs'
      - 'docs/box-v4/KITCHEN.md'
      - 'docs/box-v4/DECISIONS.md'
      - 'waves/*.md'
      # K35: the rulebook guard reads every live rule/role/card/adapter file.
      - 'kitchen/README.md'
      - 'kitchen/roles/*.md'
      - 'kitchen/stations/*.md'
      - 'templates/wave.md'
      - '.devin/rules/box-kitchen.md'
      - '.devin/plugins/box-pstack/skills/poteto-mode/SKILL.md'
      - '.devin/plugins/box-pstack/DEVIN-COMPATIBILITY.md'
      - '.claude/skills/kitchen/SKILL.md'
      - '.cursor/rules/box-kitchen.mdc'

# A newer push to the same ref cancels a stale run, queued or in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets are referenced or needed anywhere in this workflow.
permissions:
  contents: read

jobs:
  verify:
    # K50: one job per system, each reported apart; one system's failure never
    # cancels another's (fail-fast: false). Images are named, never -latest: a
    # label that moves must not change the result between two pushes.
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 10 || 45 }}
    # Git Bash on Windows: from PowerShell `cat` and `rm` are not on PATH (PF11).
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 — verify's merge-base and run-history reads need full git history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # K50: on a wave branch the checkout has origin/master but no local
      # master, and bt8b diffs master...HEAD (run 42802182752, all systems).
      - name: Make master resolvable on a wave branch
        run: git rev-parse -q --verify refs/heads/master >/dev/null || git branch master origin/master

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # `python` by name, at the host's 3.12: test:box-bounty runs a declared
      # `python -c` check against the snapshot. Ubuntu ships `python3` but no
      # `python`; setup-python provides the command and the version in one step.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Same path as the host: repository-local pnpm 10.34.5 (scripts/tooling, lockfile-pinned).
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      # Chromium into the path suite.mjs sets as PLAYWRIGHT_BROWSERS_PATH — needed by
      # tests/kitchen/k16-record.test.ts, which drives the demo recorder's browser.
      # --with-deps installs Linux system libraries; Windows and macOS need none.
      - name: Install Chromium for browser-backed tests
        run: node scripts/pnpm.mjs exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .runtime/browsers

      # K29: the older platform is gone — every suite that ran here belonged to
      # it except the bounty tool's and the kitchen's. No suite needs a
      # database anymore, so the disposable Postgres went too.
      #  * test:box-bounty has three Windows-bound tests marked host-only beside
      #    their assertions: the 'npm.cmd' setup recipe (the launcher refuses
      #    command files off Windows by design) and two junction tests (a
      #    junction is transparent to git; a Linux symlink stays a visible link
      #    and is refused under a different named reason — still a refusal).
      # `check --full` is the typecheck alone; the two suites are named so the
      # list reads as the whole suite set.
      - name: verify
        run: node scripts/verify.mjs --full test:box-bounty test:kitchen

      # PF1: the board's own suite, apart from the kitchen's acceptance profile,
      # whose duration budget measures the two suites above.
      - name: platform suite
        run: node scripts/suite.mjs platform

      - name: Upload verify run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kitchen-runs-${{ matrix.os }}-${{ github.run_id }}
          path: .kitchen/runs/
          retention-days: 7
          if-no-files-found: ignore

  # K50: the production dependency audit. The advisory database is the same
  # from every system, so one Linux job answers it. A new high or critical
  # advisory on a production dependency fails the run.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Audit production dependencies (high and critical fail)
        run: node scripts/pnpm.mjs audit --prod --audit-level high

  # BT12: the installable package's declared floor is Node 22 (NODE_MINIMUM in
  # packages/box-cli/src/node-check.ts), so the packed artifact's install
  # test and packaging test run on Node 22 here — the oldest Node the
  # package claims. The repository's own toolchain pins Node 24 (root
  # engines ">=24.11.0 <25"; pnpm refuses to install a project whose own
  # engines exclude the running Node), so dependencies are installed and the
  # artifact is packed with 24 first; only then does the job switch to the
  # current Node 22 release and run the two files, which pack the artifact
  # again under 22 and drive the whole $0 journey through it.
  # K50: on all three systems, each reported apart.
  install-node22:
    name: install-node22 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 15 || 30 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full commit SHA, never a moving tag: v7.1.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts

      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile

      - name: Build the package artifact (Node 24)
        run: node packages/box-cli/pack.mjs

      - name: Switch to Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.13.0'

      - name: Install and packaging tests on Node 22
        run: |
          node --version
          node scripts/suite.mjs box --suite bounty tests/box/bounty/bt12-install.test.ts tests/box/bounty/bt12-package.test.ts
