name: d1-backup

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.D1_BACKUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require owner configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_AGE_RECIPIENT: ${{ vars.D1_BACKUP_AGE_RECIPIENT }}
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_BACKUP_AGE_RECIPIENT; do
            if [ -z "${!key}" ]; then
              echo "backup-missing-configuration: set $key in repository Actions secrets/variables"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install repository-local pnpm
        run: npm ci --prefix scripts/tooling --ignore-scripts
      - name: Install dependencies (frozen lockfile)
        run: node scripts/pnpm.mjs install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Export, validate and encrypt
        working-directory: packages/box-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_AGE_RECIPIENT: ${{ vars.D1_BACKUP_AGE_RECIPIENT }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          dump="$RUNNER_TEMP/board.sql"
          manifest="$RUNNER_TEMP/board-manifest.json"
          encrypted="$RUNNER_TEMP/board.sql.age"
          trap 'rm -f "$dump"' EXIT
          if ! node node_modules/wrangler/bin/wrangler.js d1 export open-bounty-board --remote --output "$dump" >/dev/null 2>&1; then
            echo 'backup-export-failed: check account and D1 export permission; export output suppressed'
            exit 1
          fi
          test -s "$dump" || { echo 'backup-empty-dump'; exit 1; }
          node backup.mjs manifest "$dump" > "$manifest"
          node -e 'const m=require(process.argv[1]); console.log(JSON.stringify(m.tables, null, 2))' "$manifest"
          age --encrypt --recipient "$D1_BACKUP_AGE_RECIPIENT" --output "$encrypted" "$dump"
          rm -f "$dump"

      - name: Upload ciphertext and counts only
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/board.sql.age
            ${{ runner.temp }}/board-manifest.json
          if-no-files-found: error
          retention-days: 90
