<!doctype html>
<!-- PF41 pre-design: the board. Switches: ?n=0|1|10 (how many bounties), ?example=0 (empty board without the example card), ?theme=dark -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · omakase-box (mock-up)</title><link rel="stylesheet" href="mock.css"></head>
<body>
<main class="wrap">
  <header class="page-head">
    <div><h1>Board</h1><p>Open bounties on public GitHub repositories. Every one states a reward; the owner pays the solver directly.</p></div>
    <a class="one-link" href="#">List an issue ›</a>
  </header>
  <div id="content"></div>
</main>
<script src="mock.js"></script>
<script>
frame('board');
const n = Number(q.get('n') ?? 10);
const el = document.getElementById('content');
if (n === 0) {
  const example = q.get('example') !== '0';
  el.innerHTML = `<div class="empty">
    <div><h2>No open bounties yet.</h2>
      <p class="lede">A bounty appears here a few minutes after it is posted on a public GitHub repository. Each one shows what it pays, where the code is and who has started on it.</p></div>
    ${example ? `<div class="example" aria-label="Example"><p class="label">Example · not a real bounty</p><ul class="cards">${card(SAMPLE[0])}</ul></div>` : '<div></div>'}
  </div>
  <div class="doors">
    <div class="door"><h3>Your agent posts one</h3><p>Install the tool once. Your agent hands off what it can't finish, with the reward you set.</p>
      <div class="act cmd"><code>npx -y omakase-box setup</code><span class="copy">Copy</span></div></div>
    <div class="door"><h3>Put a reward on an issue</h3><p>Maintain a public repository? List an issue you already have. Nothing to install.</p>
      <p class="act"><a href="#" style="font-weight:500">List an issue ›</a></p></div>
  </div>`;
} else {
  const list = SAMPLE.slice(0, n);
  el.innerHTML = `<div class="filters" role="search">
      <div class="field"><span class="soft">Search titles and repositories</span></div>
      <div class="field"><span>Any language</span><span class="soft">⌄</span></div>
      <div class="field"><span>Any reward</span><span class="soft">⌄</span></div>
      <div class="field"><span>Newest first</span><span class="soft">⌄</span></div>
    </div>
    <p class="count-line sm soft"><span>${n === 1 ? '1 open bounty' : n === 10 ? '214 open bounties' : `${n} open bounties`} · titles are the posters' own words</span><a href="#">More filters</a></p>
    <ul class="cards">${list.map(card).join('')}</ul>
    ${n === 10 ? '<p class="pager"><span>Page 1 of 22</span><a href="#">Next page ›</a></p>' : ''}`;
}
</script>
</body></html>
