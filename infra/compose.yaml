name: private-task-mvp
services:
  db-private:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: private_task
      POSTGRES_USER: private_service
      POSTGRES_PASSWORD_FILE: /run/secrets/private_db_password
    secrets: [private_db_password]
    volumes: [private_database:/var/lib/postgresql/data]
    networks: [private_database]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U private_service -d private_task']
      interval: 5s
      timeout: 3s
      retries: 10
  db-external:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: external_task
      POSTGRES_USER: external_service
      POSTGRES_PASSWORD_FILE: /run/secrets/external_db_password
    secrets: [external_db_password]
    volumes: [external_database:/var/lib/postgresql/data]
    networks: [external_database]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U external_service -d external_task']
      interval: 5s
      timeout: 3s
      retries: 10
  private-api:
    build:
      context: ..
      dockerfile: infra/trusted.Dockerfile
      target: private-api
    ports: ['127.0.0.1:4000:4000']
    environment:
      TRUSTED_CONTAINER_LISTEN: 'true'
      AUTH_MODE: localhost_demo
      PRIVATE_DATABASE_HOST: db-private
      PRIVATE_DATABASE_NAME: private_task
      PRIVATE_DATABASE_USER: private_service
      PRIVATE_DATABASE_PASSWORD_FILE: /run/secrets/private_db_password
      PRIVATE_STORAGE_ROOT: /data/private
      SYNTHETIC_SNAPSHOT_SOURCE: synthetic-fixture
      PRIVATE_SESSION_KEY_FILE: /run/secrets/private_session_key
      PRIVATE_OWNER_BOOTSTRAP_FILE: /run/secrets/private_owner_bootstrap
      PRIVATE_RELEASE_KEY_FILE: /run/secrets/private_release_key
      PRIVATE_BRIDGE_KEY_FILE: /run/secrets/private_bridge_key
      PRIVATE_ASSIGNMENT_KEY_FILE: /run/secrets/private_assignment_key
      PRIVATE_RECEIPT_PUBLIC_KEY_FILE: /run/secrets/private_receipt_public_key
      PRIVATE_IMPORT_KEY_FILE: /run/secrets/private_import_key
      PRIVATE_PERMIT_PUBLIC_KEY_FILE: /run/secrets/private_permit_public_key
    secrets: [private_db_password, private_session_key, private_owner_bootstrap, private_release_key, private_bridge_key, private_assignment_key, private_receipt_public_key, private_import_key, private_permit_public_key]
    volumes: [private_storage:/data/private]
    networks: [private_database, private_ingress, assignment_delivery]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    depends_on:
      db-private: {condition: service_healthy}
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
  external-api:
    build:
      context: ..
      dockerfile: infra/trusted.Dockerfile
      target: external-api
    ports: ['127.0.0.1:4001:4001']
    environment:
      TRUSTED_CONTAINER_LISTEN: 'true'
      AUTH_MODE: localhost_demo
      EXTERNAL_DATABASE_HOST: db-external
      EXTERNAL_DATABASE_NAME: external_task
      EXTERNAL_DATABASE_USER: external_service
      EXTERNAL_DATABASE_PASSWORD_FILE: /run/secrets/external_db_password
      EXTERNAL_STORAGE_ROOT: /data/external
      EXTERNAL_SESSION_KEY_FILE: /run/secrets/external_session_key
      EXTERNAL_RELEASE_PUBLIC_KEY_FILE: /run/secrets/release_public_key
      EXTERNAL_BRIDGE_KEY_FILE: /run/secrets/external_bridge_key
      EXTERNAL_ASSIGNMENT_PUBLIC_KEY_FILE: /run/secrets/external_assignment_public_key
      EXTERNAL_RECEIPT_KEY_FILE: /run/secrets/external_receipt_key
      EXTERNAL_PERMIT_KEY_FILE: /run/secrets/external_permit_key
      EXTERNAL_IMPORT_PUBLIC_KEY_FILE: /run/secrets/external_import_public_key
    secrets: [external_db_password, external_session_key, release_public_key, external_bridge_key, external_assignment_public_key, external_receipt_key, external_permit_key, external_import_public_key]
    volumes: [external_storage:/data/external]
    networks: [external_database, external_ingress, assignment_delivery]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      db-external: {condition: service_healthy}
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
networks:
  private_database: {internal: true}
  external_database: {internal: true}
  private_ingress: {}
  external_ingress: {}
  assignment_delivery: {internal: true}
volumes:
  private_database: {}
  external_database: {}
  private_storage: {}
  external_storage: {}
secrets:
  private_db_password: {file: '${PRIVATE_DB_PASSWORD_FILE:?Configure a local private DB password file}'}
  external_db_password: {file: '${EXTERNAL_DB_PASSWORD_FILE:?Configure a different local external DB password file}'}
  private_session_key: {file: '${PRIVATE_SESSION_KEY_FILE:?Configure a private session key file}'}
  external_session_key: {file: '${EXTERNAL_SESSION_KEY_FILE:?Configure a different external session key file}'}
  private_owner_bootstrap: {file: '${PRIVATE_OWNER_BOOTSTRAP_FILE:?Configure a one-time owner bootstrap file}'}
  private_release_key: {file: '${PRIVATE_RELEASE_KEY_FILE:?Configure a private signing key file}'}
  release_public_key: {file: '${EXTERNAL_RELEASE_PUBLIC_KEY_FILE:?Configure only the release public key file}'}
  private_bridge_key: {file: '${PRIVATE_BRIDGE_KEY_FILE:?Configure a private bridge key file}'}
  external_bridge_key: {file: '${EXTERNAL_BRIDGE_KEY_FILE:?Configure an external bridge key file}'}
  private_assignment_key: {file: '${PRIVATE_ASSIGNMENT_KEY_FILE:?Configure a private assignment signing key file}'}
  private_receipt_public_key: {file: '${PRIVATE_RECEIPT_PUBLIC_KEY_FILE:?Configure only the receipt public key file}'}
  external_assignment_public_key: {file: '${EXTERNAL_ASSIGNMENT_PUBLIC_KEY_FILE:?Configure only the assignment public key file}'}
  external_receipt_key: {file: '${EXTERNAL_RECEIPT_KEY_FILE:?Configure an external receipt signing key file}'}
  private_import_key: {file: '${PRIVATE_IMPORT_KEY_FILE:?Configure a private import signing key file}'}
  private_permit_public_key: {file: '${PRIVATE_PERMIT_PUBLIC_KEY_FILE:?Configure only the permit public key file}'}
  external_permit_key: {file: '${EXTERNAL_PERMIT_KEY_FILE:?Configure an external permit signing key file}'}
  external_import_public_key: {file: '${EXTERNAL_IMPORT_PUBLIC_KEY_FILE:?Configure only the import public key file}'}
