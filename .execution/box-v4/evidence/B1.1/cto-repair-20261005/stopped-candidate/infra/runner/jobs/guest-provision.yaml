# Baseline guest image provision manifest (M5.2). Documents the exact
# software/layout the operator's sanitized baseline must carry. The digest
# pinned in /etc/private-task/runner.json binds the image this manifest
# describes; nothing here runs on the development host.
schemaVersion: 1
profile: dedicated-linux-kvm-fresh-vm

# Minimal userspace — offline only, no package-manager fetch at job time.
packages:
  - nodejs        # /usr/local/bin/node, pinned to the image's declared version
  - util-linux    # unshare, setpriv, prlimit, mount helpers
  - e2fsprogs     # fsck/mke2fs available for operator image maintenance only
  - cgroup-tools  # optional inspection; budgets are written to cgroupfs directly

# Exactly one unprivileged account. No sudo, no login shell, no other users
# beyond the base system's service accounts.
accounts:
  - name: pwuser
    uid: 1000
    gid: 1000
    home: /home/pwuser
    shell: /usr/sbin/nologin
    groups: []

# Trusted layout. The candidate never gains write access to any of these.
layout:
  /opt/private-task/harness/:
    owner: root
    mode: "0755"
    files:
      supervisor.mjs:   { source: infra/runner/jobs/harness/supervisor.mjs,   mode: "0755" }
      records.mjs:      { source: infra/runner/jobs/harness/records.mjs,      mode: "0644" }
      sandbox-spec.mjs: { source: infra/runner/jobs/harness/sandbox-spec.mjs, mode: "0644" }
      driver-pure-module.mjs: { source: infra/runner/jobs/harness/driver-pure-module.mjs, mode: "0644" }
      observations.mjs: { source: infra/runner/jobs/harness/observations.mjs, mode: "0644" }
      container-init:   { source: infra/runner/jobs/harness/container-init,   mode: "0755" }
      result-key.pem:
        # Provisioned by the operator with the baseline; public half is the
        # controller's pinned resultPublicKey. Root-only, outside every
        # candidate namespace.
        mode: "0400"
        owner: root
  /opt/private-task/composition/:
    owner: root
    mode: "0755"
    files:
      proxy-profile.mjs:       { source: infra/runner/composition/proxy-profile.mjs,       mode: "0644" }
      policy-apply.mjs:        { source: infra/runner/composition/policy-apply.mjs,        mode: "0644" }
      driver-composed.mjs:     { source: infra/runner/composition/driver-composed.mjs,     mode: "0644" }
      composed-supervisor.mjs: { source: infra/runner/composition/composed-supervisor.mjs, mode: "0644" }
  /opt/private-task/tooling/:
    owner: root
    mode: "0755"
    files:
      worker.mjs: { source: infra/runner/jobs/tooling/worker.mjs, mode: "0644" }
      build.mjs:  { source: infra/runner/jobs/tooling/build.mjs,  mode: "0755" }
  /var/private-task/staging/:
    owner: root
    mode: "0700"
  /run/:
    mode: "0755"   # tmpfs mountpoint used by container-init's device stash

# Boot: the guest has no network interface, no sshd, no cloud-init, no
# qemu-guest-agent. Init starts the supervisor once and then halts; the
# broker's destroy tears the whole domain down regardless.
init:
  - unit: private-task-supervisor.service
    exec: /usr/local/bin/node /opt/private-task/harness/supervisor.mjs
    user: root          # needs cgroup write + the result key; candidate is uid-separated
    restart: "no"
    after: []

network:
  interfaces: []        # the domain XML declares no NIC; candidate egress impossible
  dns: []

devices:
  virtioSerial:
    - name: org.private-task.control   # sole trusted channel; broker-owned host end
  blockDevices: []      # beyond the read-only root disk and per-job overlay

# Honesty boundary: this manifest describes the image contract. Building the
# image and booting it are operator actions on the dedicated host; local
# tests verify the software and specs statically and unit-test the pure
# modules — they do not boot a VM.
assurance: unverified_until_dedicated_host
