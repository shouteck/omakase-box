name = "open-bounty-board"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"
# PF38: every address but Next's own files runs the Worker first, so every page leaves with the security headers
# (src/security-headers.ts); Cloudflare applies no _headers rule to a Worker's answer. /_next/* gets the same fixed set from
# public/_headers. This makes a page view one Worker request (Workers Free: 100,000 a day).
run_worker_first = ["/*", "!/_next/*"]

[[d1_databases]]
binding = "DB"
database_name = "open-bounty-board"
database_id = "13c1a481-11a8-4cc4-bcaa-0c69a8b56000"

# PF9b: repositories this board never lists. The kitchen's sandbox: tests run there without showing as activity.
[vars]
UNLISTED_REPOSITORIES = "shouteck/box-bounty-sandbox"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
