name = "open-bounty-board"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/b/*", "/bounties.json", "/bounties.schema.json", "/numbers.json", "/numbers.schema.json", "/bounties/*", "/rss.xml", "/mcp", "/auth/*", "/solver/*", "/owner/*"]

[[d1_databases]]
binding = "DB"
database_name = "open-bounty-board"
database_id = "13c1a481-11a8-4cc4-bcaa-0c69a8b56000"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
